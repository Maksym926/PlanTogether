# Every environment-specific value is an environment variable. The value after
# the colon is the local default, matching compose.yml, so `docker compose up`
# plus the app works with nothing set. Production overrides these in
# application-prod.yaml, where there are no defaults.
spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/planTripTogether}
    username: ${DB_USERNAME:ptt}
    password: ${DB_PASSWORD:ptt}

  # Locally this is Mailpit. Defining a host is what makes Boot create a
  # JavaMailSender bean at all; no connection is opened until something sends.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  mail:
    from: ${MAIL_FROM:no-reply@plantogether.local}
